# Copy this into .github/workflows/update-fast-epg.yml on GitHub (via Add file -> Create new file)
# Runs every 6 hours on GitHub's free tier (~4 runs/day) to keep fast_epg_snapshot.js live-updated.
name: Update Pluto TV & Tubi Live EPG Snapshot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fast-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch live Pluto TV & Tubi UK EPG
        run: python3 scripts/update_fast_epg.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fast_channels_seed.js fast_epg_snapshot.js
          git diff --cached --quiet || git commit -m "chore: update Pluto TV & Tubi UK EPG snapshot"
          git push
